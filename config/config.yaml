# =============================================================================
# AwltuxTrading tunables. Secrets live in .env, not here.
# Every value below is a *default* that can be overridden in the Settings UI;
# overrides are persisted in the app_setting table.
# =============================================================================

app:
  name: AwltuxTrading
  timezone: Europe/London
  # Decisions are only produced for instruments whose symbol mapping resolved.
  require_resolved_mapping: true
  # How strict the "Needs attention" filter on the dashboard is. The reasons are
  # graded and this picks the rung; the ladder is cumulative, so level 2 includes
  # everything level 1 flags.
  #
  #   1  the figures we hold are wrong or incomplete      (~25 of 500)
  #   2  and we cannot obtain the accounts at all         (~190)
  #   3  and we have not finished covering it             (~90%)
  #
  # 3 is the honest long-run target; it is not the default because a filter that
  # selects almost the whole table tells the reader nothing. Raise it as coverage
  # improves -- it is the only change needed.
  attention_level: 1

# --- universe -----------------------------------------------------------------
universe:
  # Target size of the analysed universe (held names + watchlist are always in).
  size: 500
  exchanges:
    - LSE      # London Stock Exchange (UK)
    - NASDAQ
    - NYSE
  # Minimum median daily sterling turnover to be considered investable.
  min_daily_turnover_gbp: 250000
  # Instrument types pulled from /equity/metadata/instruments.
  instrument_types: [STOCK]

# --- ingest cadences (seconds unless noted) -----------------------------------
#
# ONE HOUR IS THE FLOOR. Nothing in this system needs finer resolution: it is a
# long-horizon advisory tool, the providers are free tiers with rate limits, and the
# daily bars it reasons about only change once a day. Several of these were once
# 45 to 900 seconds, which -- now that the scheduler actually fires them -- would
# have spent provider quota confirming that nothing had changed.
#
# The scheduler randomises each job's first run across the hour (see
# `scheduler/service.py`), so these do not all fire on the same tick. That is why the
# values are round: the spread is what stops them colliding, not a hand-picked phase.
schedule:
  t212_instruments: 86400        # daily; T212 rate limit is 1 req / 50s
  t212_account: 3600
  prices_intraday: 3600          # was 15 min; quotes are a display feed, not an input
  prices_eod: 86400              # once after the close
  quotes_held: 3600              # was 5 min
  fundamentals_rotation_per_day: 70
  edgar_submissions: 3600
  edgar_atom_events: 3600        # was 45 SECONDS; the Atom feed holds hours of events
  companies_house: 3600          # was 15 min
  news_rss: 3600                 # was 5 min
  news_finnhub: 3600             # was 20 min
  news_marketaux: 3600           # was 30 min
  news_gdelt: 3600               # was 15 min
  sentiment_aggregate: 3600
  valuation: 86400               # full sweep nightly; event-driven otherwise
  decision: 86400
  calibration: 86400
  retention: 604800
  macro_rates: 21600             # Treasury publishes once a business day

# --- provider rate-limit budgets (requests per window) ------------------------
# Scopes mirror each provider's own per-endpoint limits, because a single shared
# budget would let a fast endpoint starve a slow one.
budgets:
  # Trading 212 -- limits are per endpoint, per account.
  t212_instruments: { requests: 1,  window_seconds: 50 }
  t212_exchanges:   { requests: 1,  window_seconds: 30 }
  t212_account:     { requests: 1,  window_seconds: 5 }
  t212_positions:   { requests: 1,  window_seconds: 1 }
  t212_orders:      { requests: 1,  window_seconds: 2 }
  t212_history:     { requests: 18, window_seconds: 60 }
  yahoo:        { requests: 1800, window_seconds: 3600 }
  stooq:        { requests: 60,   window_seconds: 3600 }
  # One CSV per day changes; the budget only exists so a retry loop cannot hammer
  # the Treasury's site.
  treasury:     { requests: 12,   window_seconds: 3600 }
  # One request returns all three gilt pillars. Same reasoning as the Treasury:
  # the budget exists so a retry loop cannot hammer the BoE's site.
  gilt:         { requests: 12,   window_seconds: 3600 }
  edgar:        { requests: 5,    window_seconds: 1 }     # SEC allows 10/s; use half
  companies_house: { requests: 500, window_seconds: 300 } # CH allows 600/5min
  finnhub:      { requests: 55,   window_seconds: 60 }
  marketaux:    { requests: 100,  window_seconds: 86400 }
  gdelt:        { requests: 1,    window_seconds: 5 }
  # Embeddings, batched 64 headlines a request, so this is generous in request
  # terms and the real cost is tokens. Named for the capability rather than the
  # vendor, because the endpoint is whatever `news.embeddings.base_url` points at.
  embeddings:   { requests: 60,   window_seconds: 60 }
  deepseek:     { requests: 200,  window_seconds: 60 }
  typesafe:     { requests: 60,   window_seconds: 1 }

# --- horizons -----------------------------------------------------------------
# Two independent verdicts, because they answer different questions from
# different inputs. A stock can be unattractive for years and tactically well set
# up this month, or vice versa, and a single collapsed action cannot say which.
#
# NOTE: "short term" here means five to twenty *trading days*, judged on daily
# bars. It is not day trading. There is no supported intraday path: Trading 212
# exposes no quote endpoint at all, and the free price feed is delayed. Anything
# needing live ticks would be unsafe on this data, so the app says so rather than
# implying otherwise.
horizons:
  long_term:
    label: Long term
    guidance: 12-36 months
    description: >-
      Driven by valuation, business quality and balance-sheet strength. Ignores
      short-term price movement by design: a temporary drawdown in a sound, cheap
      business is not a reason to sell.
  short_term:
    label: Short term
    guidance: 5-20 trading days
    description: >-
      Driven by trend, momentum, volume and the direction of news and sentiment.
      Answers a different question from the long-term view and may disagree with
      it. Swing horizon on daily bars only -- not day trading.

# --- deterministic valuation model --------------------------------------------
valuation:
  # Discount rate build-up, used when a DCF is applicable.
  #
  # The risk-free rate is observed from the US Treasury's published par yield curve
  # rather than trusted to this file. It anchors the CAPM cost of equity, so it
  # decides every discounted fair value, and a constant here is honest only on the
  # day it is typed. Set `risk_free_rate_source: config` to disable the lookup and
  # pin the constant -- the value below is the fallback either way, and a run that
  # falls back to it records that it did.
  risk_free_rate_source: market      # market | config
  risk_free_rate_tenor: "10 Yr"      # which point on the curve anchors the rate
  risk_free_rate: 0.042              # fallback only; see above
  equity_risk_premium: 0.055
  default_beta: 1.0
  # Terminal growth is capped -- nothing grows faster than the economy forever.
  terminal_growth_cap: 0.025
  forecast_years: 7
  # Fade: growth decays linearly from the historical rate to terminal over the
  # forecast horizon.
  growth_fade_to_terminal: true
  # Weight of each method in the blended fair value. Weights for methods that
  # are not applicable are renormalised across the applicable ones.
  method_weights:
    dcf: 0.35
    epv: 0.20
    residual_income: 0.15
    multiples: 0.20
    dividend_discount: 0.10
    graham: 0.00          # bound only, not a blend contributor
  # Bull/bear band width as a fraction of the base value.
  scenario_spread: 0.25
  # Below this many usable methods, refuse to value rather than guess.
  min_applicable_methods: 2
  # A valuation whose method dispersion exceeds this is flagged low-confidence.
  max_method_dispersion: 0.60
  peer_group_min_size: 4

# --- shareholders' reports -----------------------------------------------------
# The annual report is the primary evidence about a business, so the bytes are kept
# rather than just a link to them (see `ingest/documents.py`).
reports:
  # Fiscal years of annual reports to hold per instrument.
  #
  # TWO FOR NOW. Most accounting markers are about persistence -- accruals that stay
  # high, cash conversion that keeps deteriorating -- and the marker code needs three
  # periods before it will call something a trend. Two gives year-on-year and no
  # more, and the markers say so. Raising this is the change to make when the
  # acquisition path has proved itself; the request was for six.
  years: 2
  # Documents downloaded per run. A 10-K can be several megabytes and the SEC asks
  # for at most ten requests a second, so a backlog drains over several runs rather
  # than in one burst.
  per_run: 60

# --- DeepSeek -----------------------------------------------------------------
llm:
  # Cheap + fast for high-volume classification and summarisation.
  model_bulk: deepseek-flash
  # Deeper reasoning for full filing extraction.
  model_deep: deepseek-v4-pro
  max_output_tokens: 8000
  temperature: 0.0
  # Prompt-cache friendly: put large documents in a stable prefix.
  enable_prefix_cache_layout: true
  # Hard monthly spend ceiling in USD; the decision layer degrades rather than
  # exceed it. Tracked in the llm_call table.
  monthly_budget_usd: 25.0
  request_timeout_seconds: 180
  max_retries: 3

# --- decision engines ---------------------------------------------------------
# Tried in order. Each answer records which engine produced it.
decision:
  engine_priority: [jev, deepseek, offline]
  # Refuse to emit a *trade suggestion* from a weaker engine than this.
  # "offline" keeps the app useful with no keys at all, but the UI marks it.
  min_engine_for_suggestion: offline
  # Pin the JEV version so confidence thresholds do not drift under an alias.
  # "jev-latest" tracks TypeSafe's stable release; prefer a versioned id.
  jev_model: jev-latest
  jev_max_state_tokens: 28000     # hard cap is 32k for state + longest question
  warn_if_fallback: true
  # Output budget for one fallback decision, in tokens. A truncated answer is
  # retried once at llm.max_output_tokens above; if it still does not fit, the
  # instrument falls through to the deterministic engine with the reason recorded.
  # Measured before this was configurable: the median response was ~3,500 tokens
  # against a hardcoded 4,000, so one decision in four was lost to the ceiling.
  deepseek_max_tokens: 6000

# --- composite scoring --------------------------------------------------------
# Weights are per horizon, because the two verdicts are built from different
# evidence and averaging them into one number would defeat the point of having
# two. The long-term weights keep the deterministic margin of safety dominant:
# the model shapes the verdict, the arithmetic anchors the rank.
composite:
  long_term_weights:
    margin_of_safety: 0.34
    valuation_verdict: 0.20
    business_quality: 0.16
    balance_sheet_risk: 0.12
    earnings_trend: 0.08
    news_materiality: 0.06
    sentiment_regime: 0.04
  # The tactical score is dominated by the quality of the setup and its downside
  # risk. Valuation still contributes -- a cheap stock has less far to fall -- but
  # it is deliberately not the driver, or this would just be the long-term view
  # with a different name.
  short_term_weights:
    short_term_setup: 0.35
    short_term_drawdown_risk: 0.20
    news_materiality: 0.20
    valuation_verdict: 0.15
    sentiment_regime: 0.10

# --- risk gate ----------------------------------------------------------------
gate:
  # Confidence floors are per engine, not per horizon: they are about how much
  # the number can be trusted, not what it is about.
  min_confidence: 0.70
  min_top_probability: 0.60
  # The fallback engine's probabilities are model-estimated, not calibrated,
  # so it is held to a stricter bar.
  min_confidence_fallback_engine: 0.80
  # The rule engine reports no probabilities at all -- its number describes how
  # good the *evidence* is, not the chance of being right. Judging it against a
  # calibration-style floor is a category error, and setting one above its
  # ceiling would make the no-keys mode silently incapable of ever suggesting
  # anything. It gets its own floor, on its own scale.
  min_confidence_rule_engine: 0.55
  # Portfolio construction limits, shared by both horizons (advisory sizing).
  max_positions: 25
  max_weight_per_name: 0.08
  max_weight_per_sector: 0.30
  min_daily_turnover_gbp: 250000
  # Per-horizon requirements. A tactical call does not need a fresh discounted
  # cash flow; it does need fresh prices and actual momentum evidence.
  long_term:
    max_price_age_seconds: 129600        # 1.5 trading days
    max_valuation_age_seconds: 604800    # 7 days
    max_filing_age_seconds: 34560000     # 400 days
    require_valuation: true
    require_filing: false
  short_term:
    max_price_age_seconds: 432000        # 5 days: the bars must be current
    max_valuation_age_seconds: 604800
    max_filing_age_seconds: 34560000
    require_valuation: false
    require_filing: false
    # A tactical call with no measured momentum is not a tactical call, so the
    # setup score is a hard requirement rather than a weight.
    min_setup_score: 2

# --- news flash ticker --------------------------------------------------------
news:
  # Minimum materiality classification for an item to reach the live ticker.
  ticker_min_materiality: mild
  dedupe_window_hours: 72
  max_items_per_feed_poll: 50
  # Output budget for one headline classification. This is NOT the length of the
  # answer (~120 tokens): it has to cover reasoning the API does not return, which
  # consumed the whole of the original 500-token cap on 6.7% of calls and returned
  # an empty body. A truncated answer is retried once at llm.max_output_tokens.
  classify_max_tokens: 2000
  # How many stories the news_relevance job may classify in one run. Relevance is
  # settled at ingest, so this only ever drains a backlog.
  relevance_backfill_per_run: 200
  # Vectorise stories so several outlets covering one event show as one entry.
  #
  # This deployment uses Fal.ai, which proxies an OpenAI-compatible embeddings API.
  # Two things about it are not the OpenAI defaults: the key travels in an
  # `Authorization: Key ...` header rather than as a bearer token, and the OpenAI
  # client's own api_key is a placeholder. Both are why `auth_scheme` exists -- a
  # client that assumes Bearer returns 401 against a perfectly valid key, which
  # reads as "the key is wrong".
  #
  # The credential comes from AWLTUX_FALAI_KEY in .env. For a local Ollama instead:
  #   base_url: http://host.docker.internal:11434/v1
  #   model: nomic-embed-text
  #   auth_scheme: ""
  # Empty base_url leaves the feature off and the lexical comparison in use, which
  # the banner says rather than implying stories were grouped when they were not.
  embeddings:
    base_url: https://fal.run/openrouter/router/openai/v1
    # The `openai/*` embedding family is refused by this route with a 401 naming the
    # organization behind the key, while non-OpenAI models answer on the same URL with
    # the same key and the same body. Measured 2026-10-07, one variable at a time --
    # header scheme, URL, vendor prefix, queue host, eight routing knobs and two
    # credentials -- and only the model changed the answer:
    #   401  openai/text-embedding-3-small   <- what this file used to ship
    #   200  baai/bge-large-en-v1.5          dim=1024
    #   200  baai/bge-m3                     dim=1024
    #   200  google/gemini-embedding-001     dim=3072
    # `baai/bge-m3` is cheaper per token, but its same-event separation has never been
    # measured, so shipping it would mean inventing `same_event_threshold` below.
    # `bge-large-en-v1.5` has been measured (see the threshold comment), so this pair
    # is the only one where neither number is a guess.
    model: baai/bge-large-en-v1.5
    auth_scheme: Key
    # Cosine similarity at or above which two stories are the same event. High on
    # purpose: joining two different events asserts something false, while missing
    # a join only shows two entries instead of one.
    #
    # Measured for this model on 18 headlines across 10 events -- four real events each
    # phrased three ways by different outlets, plus six singletons -- through the
    # application's own client (`EmbeddingClient`) and `cluster()`. That set includes the
    # case that actually breaks a threshold and which unrelated headlines do not: the
    # same company reporting two different things.
    #
    #   within-event            0.7228 .. 0.9154
    #   across-event            0.2226 .. 0.6869
    #   same company, different event   0.5967 .. 0.6869
    #
    # The separable band is (0.6869, 0.7228] -- narrow, and much narrower than a
    # three-pair smoke test suggests (that reported a +0.28 gap; this reports +0.0359).
    # Clustering all 18 at each threshold:
    #
    #   0.60  2 false joins, 0 missed     <- merging different events: a lie
    #   0.65  0 false joins, 0 missed
    #   0.70  0 false joins, 0 missed     <- shipped
    #   0.75  0 false joins, 1 missed
    #   0.86  0 false joins, 2 missed     <- what this file used to ship
    #
    # 0.70 is the measured point that is clean on both counts. It sits 0.0131 above the
    # closest across-event pair and 0.0228 below the closest within-event pair, so it is
    # not centred -- centred is 0.705 -- and the bias is toward the false-join side, which
    # is the wrong way round for this feature. It is kept anyway because it is the grid
    # point that was measured rather than an interpolation between two, and the miss it
    # avoids (a duplicate entry) is the cheap failure. 0.65 is the more cautious point and
    # is also clean; raising the value to 0.75 or beyond trades a duplicate for nothing.
    same_event_threshold: 0.70
    batch_size: 64
    max_per_run: 1000
  # Headline-level prefilter before spending an LLM call.
  prefilter:
    min_title_chars: 25
    drop_patterns:
      - '(?i)\b(horoscope|recipe|sports?|weather|lottery|crypto giveaway)\b'
    # A headline must mention one of these markers to be scored.
    require_any_ticker_mention: false

# --- retention ----------------------------------------------------------------
retention:
  quote_days: 30
  news_days: 730
  raw_payload_days: 180
  llm_call_days: 365
