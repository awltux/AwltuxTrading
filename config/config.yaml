# =============================================================================
# AwltuxTrading tunables. Secrets live in .env, not here.
# Every value below is a *default* that can be overridden in the Settings UI;
# overrides are persisted in the app_setting table.
# =============================================================================

app:
  name: AwltuxTrading
  timezone: Europe/London
  # Decisions are only produced for instruments whose symbol mapping resolved.
  require_resolved_mapping: true
  # How strict the "Needs attention" filter on the dashboard is. The reasons are
  # graded and this picks the rung; the ladder is cumulative, so level 2 includes
  # everything level 1 flags.
  #
  #   1  the figures we hold are wrong or incomplete      (~25 of 500)
  #   2  and we cannot obtain the accounts at all         (~190)
  #   3  and we have not finished covering it             (~90%)
  #
  # 3 is the honest long-run target; it is not the default because a filter that
  # selects almost the whole table tells the reader nothing. Raise it as coverage
  # improves -- it is the only change needed.
  attention_level: 1
  # Balance in USD below which a model provider is announced on every page.
  #
  # A floor rather than "tell me at zero", because the useful warning comes while there
  # is still time to act: at zero the decision engine has already fallen back to the
  # deterministic rules and the next job has already failed. Set to 0 to announce only a
  # provider that says it cannot pay. A provider whose balance cannot be read is not a
  # warning at any floor -- see `providers/balances.py`.
  balance_warn_below_usd: 5.0

# --- universe -----------------------------------------------------------------
universe:
  # Target size of the analysed universe (held names + watchlist are always in).
  size: 500
  exchanges:
    - LSE      # London Stock Exchange (UK)
    - NASDAQ
    - NYSE
  # Minimum median daily sterling turnover to be considered investable.
  min_daily_turnover_gbp: 250000
  # Instrument types pulled from /equity/metadata/instruments.
  instrument_types: [STOCK]

# --- ingest cadences (seconds unless noted) -----------------------------------
#
# ONE HOUR IS THE FLOOR. Nothing in this system needs finer resolution: it is a
# long-horizon advisory tool, the providers are free tiers with rate limits, and the
# daily bars it reasons about only change once a day. Several of these were once
# 45 to 900 seconds, which -- now that the scheduler actually fires them -- would
# have spent provider quota confirming that nothing had changed.
#
# The scheduler randomises each job's first run across the hour (see
# `scheduler/service.py`), so these do not all fire on the same tick. That is why the
# values are round: the spread is what stops them colliding, not a hand-picked phase.
schedule:
  t212_instruments: 86400        # daily; T212 rate limit is 1 req / 50s
  t212_account: 3600
  # Every held instrument through the full refresh sequence. About 100 seconds each and a
  # handful of model calls, so this is the setting that decides what a fresh position costs.
  held_refresh: 3600
  prices_intraday: 3600          # was 15 min; quotes are a display feed, not an input
  prices_eod: 86400              # once after the close
  sector_index: 86400            # derived from those bars; more often rewrites the same line
  quotes_held: 3600              # was 5 min
  fundamentals_rotation_per_day: 70
  # The decision sweep is bounded and rotated, for the same reason fundamentals is:
  # at 4.1 decisions a minute the whole universe in one call is a 110-minute job that
  # cannot finish inside any interval, and every deploy killed it mid-sweep. Each
  # hourly run decides the least recently decided names, so a day still covers the
  # universe. Raising this multiplies the model spend, not just the run length.
  decision_rotation_per_day: 500
  edgar_submissions: 3600
  edgar_atom_events: 3600        # was 45 SECONDS; the Atom feed holds hours of events
  companies_house: 3600          # was 15 min
  news_rss: 3600                 # was 5 min
  news_sectors: 3600             # eleven feeds, same cadence as the instrument poll
  news_finnhub: 3600             # was 20 min
  news_marketaux: 3600           # was 30 min
  news_gdelt: 3600               # was 15 min
  sentiment_aggregate: 3600
  valuation: 86400               # full sweep nightly; event-driven otherwise
  decision: 3600                  # hourly, a rotated slice; was a daily full sweep
  calibration: 86400
  retention: 604800
  macro_rates: 21600             # Treasury publishes once a business day
  # Two requests an hour, and the point is to warn before the account empties rather
  # than after -- at zero the decision engine has already fallen back to the rules.
  provider_balance: 3600

# --- provider rate-limit budgets (requests per window) ------------------------
# Scopes mirror each provider's own per-endpoint limits, because a single shared
# budget would let a fast endpoint starve a slow one.
#
# Two rules for reading these:
#
# * **Every provider this app calls must have an entry.** A provider with no entry
#   used to mean *no limit at all*, which is how the keyless news feeds ended up
#   calling Google and Yahoo a thousand times a sweep with no ceiling;
#   `tests/test_repo_hygiene.py` now fails if a name in the tree has no rule, and an
#   unlisted name falls back to a conservative default rather than to infinity.
# * **A daily quota sets `reset: utc_day`.** A "N per 86400s" window anchored to
#   whenever this process first asked is a *rolling* day, which does not line up with
#   the provider's: 90 requests in the last hours of their Monday and 90 more after
#   our window turns over is up to 180 inside their Tuesday. `utc_day` makes our
#   counter reset when theirs does.
budgets:
  # Trading 212 -- limits are per endpoint and per *account* ("regardless of which API
  # key is used or which IP address the request originates from"), so a second key buys
  # nothing. Paced at about 1.5x the documented period: a 429 refuses the endpoint for
  # the *remainder of the window*, which costs more than the extra wait does.
  # Documented: instruments 1/50s, exchanges 1/30s, summary 1/5s, positions 1/1s,
  # history 20/60s.
  t212_instruments: { requests: 1,  window_seconds: 75 }
  t212_exchanges:   { requests: 1,  window_seconds: 45 }
  t212_account:     { requests: 1,  window_seconds: 8 }
  t212_positions:   { requests: 1,  window_seconds: 2 }
  t212_orders:      { requests: 1,  window_seconds: 3 }
  t212_history:     { requests: 16, window_seconds: 60 }
  # 30 a minute sits well under what Yahoo's undocumented endpoints tolerate, and the
  # real request count is two to four times this because yfinance makes several HTTP
  # calls per method call. Yahoo rate-limits by IP and answers a burst with 429s that
  # look like "no data" once yfinance has swallowed them. The day's ceiling is ours:
  # only a community figure exists for it, and no quota is published at all.
  yahoo:        { requests: 4000, window_seconds: 86400, reset: utc_day, min_interval_seconds: 2 }
  # One CSV per business day, so anything beyond a handful of requests is waste. The
  # only published guidance is none at all: robots.txt explicitly allows everything.
  treasury:     { requests: 50,   window_seconds: 86400, reset: utc_day, min_interval_seconds: 10 }
  # One request returns all three gilt pillars, and the series move once a business day.
  # Same reasoning as the Treasury, and the same absence of a published limit.
  gilt:         { requests: 50,   window_seconds: 86400, reset: utc_day, min_interval_seconds: 10 }
  # The SEC allows 10 requests/second per *IP address* ("regardless of the number of
  # machines used to submit requests"), and a breach limits the address for ten minutes.
  # Half of it, and the User-Agent declares a contact because an undeclared client is
  # refused outright.
  edgar:        { requests: 5,    window_seconds: 1 }
  # Companies House allows 600 per 5 minutes per application and says it "reserve[s] the
  # right to ban without notice applications that regularly exceed" it, so this is the
  # one that gets real headroom -- 1 a second. There is no separately documented limit
  # for the Document API, and it is not in the sandbox.
  companies_house: { requests: 300, window_seconds: 300 }
  # --- news feeds --------------------------------------------------------------
  # Google News RSS and Yahoo's per-ticker feed: keyless, limit undocumented (Google's
  # own forum calls it an undefined "fair use" quota and warns that a 10k-a-day scraper
  # "might get blocked"), and the reported failure is a 503 "automated queries" page or a
  # flat IP block rather than a polite 429. So both knobs are ours: a pace of one request
  # every 5 seconds and a day's ceiling. The volume is the real problem and `TODO.md`
  # carries it -- a full 500-name sweep is about 1,200 requests, which is not feed-reader
  # traffic, and the fix is to ask for several companies per query rather than one.
  rss:          { requests: 2000, window_seconds: 86400, reset: utc_day, min_interval_seconds: 5 }
  # Finnhub documents 60 calls a minute, plus a global 30-a-second ceiling it says sits
  # "on top of all plan's limit". 30 a minute is half the first and far under the second.
  finnhub:      { requests: 30,   window_seconds: 60 }
  # Marketaux's free plan is 100 requests/day with at most 3 articles a request, and one
  # request carries one symbol -- so the allowance is a *day's*, 80 leaves room for a
  # retry inside it, and the spacing respects the per-60-second limiter it also keeps
  # ("too many requests in the past 60 seconds") whose number is not documented. A spent
  # day answers HTTP 402, which stops us until the day turns over rather than retrying.
  # The quota is spent on a rotating slice of the universe -- see `ingest/news.py` and
  # `Instrument.marketaux_polled_at`.
  marketaux:    { requests: 80,   window_seconds: 86400, reset: utc_day, min_interval_seconds: 3 }
  # GDELT's own error text asks for "one request every 5 seconds"; the datasets are
  # otherwise offered "unlimited and unrestricted", so the 400-a-day ceiling is ours.
  # It also wants a real User-Agent, which this client always sends.
  gdelt:        { requests: 400,  window_seconds: 86400, reset: utc_day, min_interval_seconds: 6 }
  # --- models ------------------------------------------------------------------
  # Embeddings, batched 64 headlines a request, so this is generous in request
  # terms and the real cost is tokens. Named for the capability rather than the
  # vendor, because the endpoint is whatever `news.embeddings.base_url` points at.
  # Both fal's model APIs and this endpoint are limited by *concurrency* rather than by
  # rate (2 in flight on a new account, 40 self-served), which a budget cannot express;
  # this bounds the burst, and the batch loop is what bounds concurrency.
  embeddings:   { requests: 60,   window_seconds: 60 }
  # DeepSeek publishes concurrency limits and no requests-per-minute figure at all
  # (2500 in flight for `deepseek-flash`). This is a burst bound, not the real control:
  # the engine makes one call at a time and answers a 429 or a 503 with a retry.
  deepseek:     { requests: 200,  window_seconds: 60 }
  # TypeSafe documents 80 requests/second but also says the limits "are adjusting
  # dynamically ... can change without notice", so this sits far below it.
  typesafe:     { requests: 5,    window_seconds: 1 }
  # fal's *platform* API (the billing read) rather than its inference endpoint: one
  # call an hour, and the rule exists so a retry loop cannot turn that into a burst.
  fal:          { requests: 30,   window_seconds: 60 }

# --- deep-dive research -------------------------------------------------------
# One report per explicit request, never on a schedule. There is no interval and no
# probe here on purpose: a report costs a full pipeline refresh for the instrument
# plus one deep model call over the held annual reports, so it is triggered by a
# reader pressing a button and by nothing else. Everything below bounds a single run.
research:
  enabled: true

  # Skip the refresh phase when a successful refresh finished this recently. The refresh
  # is the long half -- thirteen steps, minutes, provider and model spend -- so pressing
  # Research twice in a quarter of an hour must not re-run it for unchanged data. The
  # report records that the refresh was skipped, so the reader knows what it rests on.
  # Zero re-runs it every time.
  refresh_within_minutes: 30

  # The news digest: the window it is drawn from, how many stories it carries, and how
  # far down the priority order to scan before taking the top. `window` is a *scan*
  # bound, not a display one -- priority is materiality x credibility x recency and is
  # computed in Python, so the ranking has to score a bounded recent set and sort it,
  # the same reasoning the flash ticker records. Measured 2026-10-09: 10,739 stories
  # arrive in 30 days, so 300 is a few days of corpus and the top dozen is always well
  # inside it.
  news_digest_days: 30
  news_digest_limit: 12
  news_digest_window: 300

  # Held annual reports fed to the model, bounded per document and in total. The
  # per-document cap is larger than the filing extractor's 400,000 because a research
  # read wants the whole report, and truncation keeps the head and the tail -- which is
  # where the primary statements are. The total is what bounds the bill: 400,000
  # characters is about 118,000 input tokens.
  max_documents: 3
  max_document_chars: 200000
  max_total_document_chars: 400000

  # Above `llm.max_output_tokens`, because a research report is longer than any
  # classification or extraction this system asks for.
  max_output_tokens: 16000

  # Reports listed on the page, and when a report still marked `running` is shown as
  # stale rather than as work in progress.
  list_limit: 25
  stale_minutes: 180

  # The model. `null` means `llm.model_deep`, which is the point of the feature: this is
  # the one task that asks for the deep model deliberately.
  model:

# --- horizons -----------------------------------------------------------------
# Two independent verdicts, because they answer different questions from
# different inputs. A stock can be unattractive for years and tactically well set
# up this month, or vice versa, and a single collapsed action cannot say which.
#
# NOTE: "short term" here means five to twenty *trading days*, judged on daily
# bars. It is not day trading. There is no supported intraday path: Trading 212
# exposes no quote endpoint at all, and the free price feed is delayed. Anything
# needing live ticks would be unsafe on this data, so the app says so rather than
# implying otherwise.
horizons:
  long_term:
    label: Long term
    guidance: 12-36 months
    description: >-
      Driven by valuation, business quality and balance-sheet strength. Ignores
      short-term price movement by design: a temporary drawdown in a sound, cheap
      business is not a reason to sell.
  short_term:
    label: Short term
    guidance: 5-20 trading days
    description: >-
      Driven by trend, momentum, volume and the direction of news and sentiment.
      Answers a different question from the long-term view and may disagree with
      it. Swing horizon on daily bars only -- not day trading.

# --- deterministic valuation model --------------------------------------------
valuation:
  # Discount rate build-up, used when a DCF is applicable.
  #
  # The risk-free rate is observed from the US Treasury's published par yield curve
  # rather than trusted to this file. It anchors the CAPM cost of equity, so it
  # decides every discounted fair value, and a constant here is honest only on the
  # day it is typed. Set `risk_free_rate_source: config` to disable the lookup and
  # pin the constant -- the value below is the fallback either way, and a run that
  # falls back to it records that it did.
  risk_free_rate_source: market      # market | config
  risk_free_rate_tenor: "10 Yr"      # which point on the curve anchors the rate
  risk_free_rate: 0.042              # fallback only; see above
  equity_risk_premium: 0.055
  default_beta: 1.0
  # Terminal growth is capped -- nothing grows faster than the economy forever.
  terminal_growth_cap: 0.025
  forecast_years: 7
  # Fade: growth decays linearly from the historical rate to terminal over the
  # forecast horizon.
  growth_fade_to_terminal: true
  # Weight of each method in the blended fair value. Weights for methods that
  # are not applicable are renormalised across the applicable ones.
  method_weights:
    dcf: 0.35
    epv: 0.20
    residual_income: 0.15
    multiples: 0.20
    dividend_discount: 0.10
    graham: 0.00          # bound only, not a blend contributor
  # Bull/bear band width as a fraction of the base value.
  scenario_spread: 0.25
  # Below this many usable methods, refuse to value rather than guess.
  min_applicable_methods: 2
  # A valuation whose method dispersion exceeds this is flagged low-confidence.
  max_method_dispersion: 0.60
  peer_group_min_size: 4

# --- shareholders' reports -----------------------------------------------------
# The annual report is the primary evidence about a business, so the bytes are kept
# rather than just a link to them (see `ingest/documents.py`).
reports:
  # Fiscal years of annual reports to hold per instrument.
  #
  # TWO FOR NOW. Most accounting markers are about persistence -- accruals that stay
  # high, cash conversion that keeps deteriorating -- and the marker code needs three
  # periods before it will call something a trend. Two gives year-on-year and no
  # more, and the markers say so. Raising this is the change to make when the
  # acquisition path has proved itself; the request was for six.
  years: 2
  # Documents downloaded per run. A 10-K can be several megabytes and the SEC asks
  # for at most ten requests a second, so a backlog drains over several runs rather
  # than in one burst.
  per_run: 60

# --- DeepSeek -----------------------------------------------------------------
llm:
  # Cheap + fast for high-volume classification and summarisation.
  model_bulk: deepseek-flash
  # Deeper reasoning for full filing extraction.
  model_deep: deepseek-v4-pro
  max_output_tokens: 8000
  temperature: 0.0
  # Prompt-cache friendly: put large documents in a stable prefix.
  enable_prefix_cache_layout: true
  # Hard monthly spend ceiling in USD; the decision layer degrades rather than
  # exceed it. Tracked in the llm_call table.
  monthly_budget_usd: 25.0
  request_timeout_seconds: 180
  max_retries: 3

# --- decision engines ---------------------------------------------------------
# Tried in order. Each answer records which engine produced it.
decision:
  engine_priority: [jev, deepseek, offline]
  # Refuse to emit a *trade suggestion* from a weaker engine than this.
  # "offline" keeps the app useful with no keys at all, but the UI marks it.
  min_engine_for_suggestion: offline
  # Pin the JEV version so confidence thresholds do not drift under an alias.
  # "jev-latest" tracks TypeSafe's stable release; prefer a versioned id.
  jev_model: jev-latest
  jev_max_state_tokens: 28000     # hard cap is 32k for state + longest question
  warn_if_fallback: true
  # Output budget for one fallback decision, in tokens. A truncated answer is
  # retried once at llm.max_output_tokens above; if it still does not fit, the
  # instrument falls through to the deterministic engine with the reason recorded.
  # Measured before this was configurable: the median response was ~3,500 tokens
  # against a hardcoded 4,000, so one decision in four was lost to the ceiling.
  #
  # Raised 6000 -> 8000 on 2026-10-08 to remove the retry path. Measured: 12 of 1,626
  # decision calls (0.7%) still landed exactly on 6000 and were retried at
  # `llm.max_output_tokens` (8000), so each of those decisions cost two calls. The retry
  # list in `deepseek_engine.decide` is `dict.fromkeys((deepseek_max_tokens,
  # max_output_tokens))`, so at 8000 it collapses to a single attempt and a long answer is
  # asked for once rather than twice. `max_tokens` is a cap and not a reservation, so this
  # costs nothing on the 99.3% of calls that never approach it.
  deepseek_max_tokens: 8000

# --- composite scoring --------------------------------------------------------
# Weights are per horizon, because the two verdicts are built from different
# evidence and averaging them into one number would defeat the point of having
# two. The long-term weights keep the deterministic margin of safety dominant:
# the model shapes the verdict, the arithmetic anchors the rank.
composite:
  long_term_weights:
    margin_of_safety: 0.34
    valuation_verdict: 0.20
    business_quality: 0.16
    balance_sheet_risk: 0.12
    earnings_trend: 0.08
    news_materiality: 0.06
    sentiment_regime: 0.04
  # The tactical score is dominated by the quality of the setup and its downside
  # risk. Valuation still contributes -- a cheap stock has less far to fall -- but
  # it is deliberately not the driver, or this would just be the long-term view
  # with a different name.
  short_term_weights:
    short_term_setup: 0.35
    short_term_drawdown_risk: 0.20
    news_materiality: 0.20
    valuation_verdict: 0.15
    sentiment_regime: 0.10

# --- risk gate ----------------------------------------------------------------
gate:
  # Confidence floors are per engine, not per horizon: they are about how much
  # the number can be trusted, not what it is about.
  min_confidence: 0.70
  min_top_probability: 0.60
  # The fallback engine's probabilities are model-estimated, not calibrated,
  # so it is held to a stricter bar.
  min_confidence_fallback_engine: 0.80
  # The rule engine reports no probabilities at all -- its number describes how
  # good the *evidence* is, not the chance of being right. Judging it against a
  # calibration-style floor is a category error, and setting one above its
  # ceiling would make the no-keys mode silently incapable of ever suggesting
  # anything. It gets its own floor, on its own scale.
  min_confidence_rule_engine: 0.55
  # Portfolio construction limits, shared by both horizons (advisory sizing).
  max_positions: 25
  max_weight_per_name: 0.08
  max_weight_per_sector: 0.30
  min_daily_turnover_gbp: 250000
  # Per-horizon requirements. A tactical call does not need a fresh discounted
  # cash flow; it does need fresh prices and actual momentum evidence.
  long_term:
    max_price_age_seconds: 129600        # 1.5 trading days
    max_valuation_age_seconds: 604800    # 7 days
    max_filing_age_seconds: 34560000     # 400 days
    require_valuation: true
    require_filing: false
  short_term:
    max_price_age_seconds: 432000        # 5 days: the bars must be current
    max_valuation_age_seconds: 604800
    max_filing_age_seconds: 34560000
    require_valuation: false
    require_filing: false
    # A tactical call with no measured momentum is not a tactical call, so the
    # setup score is a hard requirement rather than a weight.
    min_setup_score: 2

# --- news flash ticker --------------------------------------------------------
news:
  # Minimum materiality classification for an item to reach the ticker, live or on first
  # paint. `none` is excluded by any value here, which is most of the corpus: measured
  # 2026-10-08, 12,125 of 26,301 stored stories are classified `none`.
  #
  # Raise to `moderate` for a quieter banner (leaves ~4,883 stories rather than ~12,364).
  # The ranking already sorts by materiality x credibility x recency, so this is a floor
  # rather than the ordering.
  ticker_min_materiality: mild
  max_items_per_feed_poll: 50
  # Output budget for one headline classification. This is NOT the length of the
  # answer (~120 tokens): it has to cover reasoning the API does not return, which
  # consumed the whole of the original 500-token cap on 6.7% of calls and returned
  # an empty body. A truncated answer is retried once at llm.max_output_tokens.
  classify_max_tokens: 2000
  # How many stories the news_relevance job may classify in one run. Relevance is
  # settled at ingest, so this only ever drains a backlog.
  relevance_backfill_per_run: 200
  # Vectorise stories so several outlets covering one event show as one entry.
  #
  # This deployment uses Fal.ai, which proxies an OpenAI-compatible embeddings API.
  # Two things about it are not the OpenAI defaults: the key travels in an
  # `Authorization: Key ...` header rather than as a bearer token, and the OpenAI
  # client's own api_key is a placeholder. Both are why `auth_scheme` exists -- a
  # client that assumes Bearer returns 401 against a perfectly valid key, which
  # reads as "the key is wrong".
  #
  # The credential comes from AWLTUX_FALAI_KEY in .env. For a local Ollama instead:
  #   base_url: http://host.docker.internal:11434/v1
  #   model: nomic-embed-text
  #   auth_scheme: ""
  # Empty base_url leaves the feature off and the lexical comparison in use, which
  # the banner says rather than implying stories were grouped when they were not.
  embeddings:
    base_url: https://fal.run/openrouter/router/openai/v1
    # The `openai/*` embedding family is refused by this route with a 401 naming the
    # organization behind the key, while non-OpenAI models answer on the same URL with
    # the same key and the same body. Measured 2026-10-07, one variable at a time --
    # header scheme, URL, vendor prefix, queue host, eight routing knobs and two
    # credentials -- and only the model changed the answer:
    #   401  openai/text-embedding-3-small   <- what this file used to ship
    #   200  baai/bge-large-en-v1.5          dim=1024
    #   200  baai/bge-m3                     dim=1024
    #   200  google/gemini-embedding-001     dim=3072
    # `baai/bge-m3` is cheaper per token, but its same-event separation has never been
    # measured, so shipping it would mean inventing `same_event_threshold` below.
    # `bge-large-en-v1.5` has been measured (see the threshold comment), so this pair
    # is the only one where neither number is a guess.
    model: baai/bge-large-en-v1.5
    auth_scheme: Key
    # Cosine similarity at or above which two stories may be shown as the same event.
    # **This is a tie-break, not the decision.** Since 0011 the grouping first requires
    # that the stories not contradict each other on event type, direction or metric --
    # the exact fields the classifier already writes -- and similarity only decides
    # which of several compatible anchors a story belongs to.
    #
    # Measured twice, and the second measurement is why the rule changed rather than
    # the number.
    #
    # The synthetic set -- 18 headlines across 10 events, four real events phrased three
    # ways plus six singletons -- put within-event pairs at 0.7228..0.9154 and
    # across-event pairs at 0.2226..0.6869, a separable band of (0.6869, 0.7228].
    #
    # That band does not hold on real data. Measured 2026-10-07 against 400 real
    # embedded stories and 79,800 same-instrument pairs:
    #
    #   score   0.70   0.75   0.80   0.85   0.90
    #   pairs    579    460    275    139     92   (same-instrument pairs at or above)
    #
    #   true join   0.7925  "EasyJet Shares Jump As Apollo Launches Higher $7.7bn Bid"
    #                       "EasyJet stock weighs Apollo's 715p cash takeover offer"
    #   false join  0.7599  "Golar LNG stock gains 1.65 percent in October 5 trading"
    #                       "BTIG raises Golar LNG stock price target to $75"
    #   false join  0.8578  "Canadian National Railway stock falls Wednesday, underperforms"
    #                       "Canadian National Railway stock rises Wednesday, outperforms"
    #
    # The distributions **overlap**: the false CN pair is the highest-scoring pair in
    # the set. No threshold separates them, and moving the number only chooses which
    # error to make -- 0.85, which this file briefly shipped, drops the true EasyJet
    # join and keeps the worst false one.
    #
    # 0.70 is kept because it is the measured point and because the asymmetry above
    # only applies once the keys have run. What made 0.70 look wrong was never the
    # number: at 0.70 the grouping made 672 joins and **439 of them (65%) contradicted
    # the stored event type or direction of their own group**. Those are now vetoed
    # before the cosine is consulted, 0.70 is a tie-break among stories that agree, and
    # a low threshold that admits duplicates is the cheap failure.
    same_event_threshold: 0.70
    batch_size: 64
    max_per_run: 1000
  # Headline-level prefilter before spending an LLM call.
  prefilter:
    min_title_chars: 25
    drop_patterns:
      - '(?i)\b(horoscope|recipe|sports?|weather|lottery|crypto giveaway)\b'
    # A headline must mention one of these markers to be scored.
    require_any_ticker_mention: false

# --- retention ----------------------------------------------------------------
retention:
  quote_days: 30
  news_days: 730
  raw_payload_days: 180
  llm_call_days: 365
