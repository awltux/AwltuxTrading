# AwltuxTrading -- single-container deployment.
#
#   cp .env.example .env     # then fill in your keys
#   docker compose up -d
#   open http://localhost:8080
#
# The service is advisory-only. No order is ever placed unless you both point it
# at the live base URL AND set AWLTUX_ALLOW_LIVE_ORDERS=true.

services:
  awltux:
    build:
      context: .
      dockerfile: Dockerfile
    image: awltux-trading:0.1.0
    container_name: awltux-trading
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The volume is the only place the container needs to write.
      AWLTUX_DATA_DIR: /data
      AWLTUX_CONFIG_FILE: /app/config/config.yaml
      AWLTUX_HOST: 0.0.0.0
      # Port comes from .env so changing it there is enough. `environment`
      # overrides `env_file`, so this must be interpolated rather than hardcoded.
      AWLTUX_PORT: "${AWLTUX_PORT:-8080}"
    ports:
      # Bound to loopback: this dashboard shows your holdings and is not
      # authenticated, so it must not be exposed on a network by default.
      - "127.0.0.1:${AWLTUX_PORT:-8080}:${AWLTUX_PORT:-8080}"
    volumes:
      - awltux-data:/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  awltux-data:
    name: awltux-data
