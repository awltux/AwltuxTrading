# AwltuxTrading -- single-container deployment.
#
#   cp .env.example .env     # then fill in your keys
#   docker compose up -d
#   open http://localhost:8080
#
# The service is advisory-only. No order is ever placed unless you both point it
# at the live base URL AND set AWLTUX_ALLOW_LIVE_ORDERS=true.

services:
  awltux:
    build:
      context: .
      dockerfile: Dockerfile
    # Not a version claim. This used to read `awltux-trading:0.1.0`, which was the
    # fifth place the version was typed by hand and the one nobody would think to
    # update. The image's version is baked at build time from the release tag and
    # reported on the Info page, which is the only place that can be authoritative;
    # a local tag that disagreed would just be a second, wrong answer.
    image: awltux-trading:local
    container_name: awltux-trading
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The volume is the only place the container needs to write.
      AWLTUX_DATA_DIR: /data
      AWLTUX_CONFIG_FILE: /app/config/config.yaml
      AWLTUX_HOST: 0.0.0.0
      # Port comes from .env so changing it there is enough. `environment`
      # overrides `env_file`, so this must be interpolated rather than hardcoded.
      AWLTUX_PORT: "${AWLTUX_PORT:-8080}"
      # Two processes in the container, so that the web tier can have several workers.
      # `awltux/main.py` builds one app per worker and the lifespan starts a scheduler in
      # each, so with the scheduler owned here four workers would be four job runners -- the
      # entrypoint starts `awltux schedule` and the web processes *ask* it instead. Unset
      # AWLTUX_WEB_WORKERS to fall back to a single process.
      AWLTUX_SCHEDULER_ENABLED: "false"
      AWLTUX_SCHEDULER_CONTROL_URL: "http://127.0.0.1:${AWLTUX_CONTROL_PORT:-8099}"
      AWLTUX_CONTROL_PORT: "${AWLTUX_CONTROL_PORT:-8099}"
      AWLTUX_WEB_WORKERS: "${AWLTUX_WEB_WORKERS:-4}"
    ports:
      # Published on loopback by default: this dashboard shows your holdings and is
      # not authenticated, so it must not be exposed on a network unless you say so.
      #
      # Set AWLTUX_BIND_ADDRESS in `.env` to reach it from another machine -- the
      # host's own address, e.g. 192.168.1.189. That address is machine-specific and
      # often handed out by DHCP, so it lives in `.env` rather than here; if the lease
      # changes, `docker compose up` fails with "cannot assign requested address" until
      # this is updated. `0.0.0.0` publishes on every interface (including the WSL and
      # Hyper-V switches) and leaves the firewall as the only thing in front of it.
      - "${AWLTUX_BIND_ADDRESS:-127.0.0.1}:${AWLTUX_PORT:-8080}:${AWLTUX_PORT:-8080}"
    volumes:
      - awltux-data:/data
    # Long enough for the scheduler's drain to finish a job mid-batch rather than
    # being SIGKILLed partway. The app's own budget is AWLTUX_SHUTDOWN_DRAIN_SECONDS
    # (20 by default) and must stay under this figure, or Docker kills first and the
    # wait is theatre. A job known to run for minutes should be headed off with
    # `awltux quiet` before the container is replaced -- this is the safety net, not
    # the mechanism.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  awltux-data:
    name: awltux-data
