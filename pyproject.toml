[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awltux-trading"
# Packaging metadata, and a *fallback* only. The running version is derived from the
# nearest release tag at build time (`awltux/version.py`) and baked into
# `build_info.json`; this value is reached only by a wheel installed somewhere with
# neither git nor that file, and the Info page labels it `packaging metadata` when it
# is used so a stale fallback cannot pass for a release. Kept roughly in step by hand
# because setuptools needs a literal here to build a wheel at all.
version = "0.1.0"
description = "Background share valuation and market-sentiment advisor for Trading 212 (UK + US)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AwltuxTrading" }]

dependencies = [
    # web / api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    # data / orm
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # http / parsing
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    # market data / maths
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    # scheduling
    "apscheduler>=3.10",
    # The IANA time zone database. Declared rather than assumed: `zoneinfo` looks
    # for it on the system, and a slim container image frequently has none -- at
    # which point every zone lookup fails and the whole dashboard silently
    # displays UTC while appearing to work.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
]
# Real JEV / TypeSafe client. Optional: the raw HTTP client in
# awltux.decision.jev works without it.
lev = ["typesafe-sdk>=0.1"]

[project.scripts]
awltux = "awltux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# build_info.json is not source: the Docker build writes it into src/awltux just
# before installing, so the installed package can name the revision it came from.
# It is gitignored, which is also what keeps the build's "was the tree dirty?"
# check honest.
awltux = [
    "web/templates/**/*.html",
    "web/static/**/*",
    "llm/prompts/**/*.txt",
    "build_info.json",
]
# Migration revisions are .py modules and ship as code, but the Alembic template
# is not, and a missing script.py.mako would break `alembic revision`.
"awltux.db.migrations" = ["*.mako", "versions/*.py"]

[tool.pytest.ini_options]
# `ingest_youtube` is a top-level tool rather than part of the package, but its tests
# are the ones that keep YouTube's rate limiting honest, so they belong in the default
# run: with only "tests" here they are collected by nobody and rot silently.
testpaths = ["tests", "ingest_youtube"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "network: test requires live network access (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Local scratch: pip's temp directory and the suite's working directory. These
# live inside the repo so they work under a file-access sandbox, but they are not
# source and must not be linted.
extend-exclude = [".pip-tmp", ".tests-tmp", ".venv", "data"]

[tool.ruff.lint]
# C90 is the one debt rule with a number attached, and the number is the point: a
# rule that lives only in a prose standard is followed until the first deadline.
# Complexity -- not line count -- is what makes a function hard to change, because
# every branch is a case someone has to hold in their head at once.
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# Fifteen paths through one function. Most of this tree is far under it. The five
# functions above it carry a `# noqa: C901` naming why the flat form is the clearer
# one -- a decision table read top to bottom, where extracting the branches into
# helpers would scatter one policy across five functions and hide the ordering
# that *is* the rule. That list is a ledger: it only shrinks, and adding to it is
# a decision rather than an accident.
max-complexity = 15
